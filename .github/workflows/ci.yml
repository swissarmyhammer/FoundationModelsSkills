name: CI

# The org test contract (swissarmyhammer/workflows' README) applies here in
# full. This repository satisfies it with two jobs of the shared workflow:
#
# - The unit job runs `swift test` at the root, less one suite. Every other
#   suite of the single `FoundationModelsSkillsTests` target is a unit test:
#   none needs a network, a GPU, or much wall-clock time.
# - `HotReloadLiveTests` is that one suite. It drives a real on-device Apple
#   Intelligence model, thus `test-skip` holds it out of the unit job and the
#   unit job stays fast.
# - `integration-filter` names that same suite, and only it. That input alone
#   starts the shared workflow's integration job, which runs on a
#   `[self-hosted, macOS]` pool that has Apple Intelligence. No other
#   `integration-*` input is given: `integration-gate-env` is the legacy path
#   and the shared workflow stops the job when it arrives beside a selector,
#   and this package has one test target, thus no nested integration package.
# - The suite keeps its own model-availability gate. A host with no on-device
#   model reports it as skipped, never as a failure.
# - Every input of the shared workflow is optional. `CIWorkflowTests` pins the
#   delegation from this side: the `uses:` target, the single job with no
#   `steps:` of its own, the two inputs below, the triggers, and the
#   concurrency group.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    uses: swissarmyhammer/workflows/.github/workflows/swift-ci.yaml@main
    with:
      # Hold the live-model suite out of the unit job: it needs Apple
      # Intelligence on the runner.
      test-skip: FoundationModelsSkillsTests.HotReloadLiveTests
      # Run that same suite, and only it, in the integration job.
      integration-filter: FoundationModelsSkillsTests.HotReloadLiveTests
