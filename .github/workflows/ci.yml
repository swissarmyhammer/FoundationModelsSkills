name: CI

# The org test contract (the README of swissarmyhammer/workflows) applies here
# in full. This repository satisfies it with one job of the shared workflow, in
# Shape 2 (a nested integration package):
#
# - The root package has one test target, `FoundationModelsSkillsTests`. Each
#   suite in it is a unit test: no suite needs a network, a model, or much
#   time. With no test selector, the unit job runs `swift build --build-tests`
#   and a plain `swift test`, and that run holds each suite of the target.
# - The integration tests live in the nested `IntegrationTests/` package
#   (`FoundationModelsSkillsIntegrationTests`). Their real dependency is the
#   on-device Apple Intelligence model. The root `swift test` cannot reach
#   them, and `integration-package-path` makes the integration job run
#   `swift test --package-path IntegrationTests` on a `[self-hosted, macOS]`
#   runner that has Apple Intelligence. The unit job builds that package on
#   every run, thus a broken integration test cannot stay unseen.
# - Each integration test keeps its own model-availability gate. A host with
#   no on-device model reports it as skipped, never as a failure.
# - No environment variable selects a suite: this workflow passes no
#   `integration-gate-env` input.
# - `CIWorkflowTests` pins this shape from the other side: the `uses:` target,
#   the single job with no `steps:` of its own, the one input, the triggers,
#   and the concurrency group.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    uses: swissarmyhammer/workflows/.github/workflows/swift-ci.yaml@main
    with:
      # Run the nested integration package in the integration job.
      integration-package-path: IntegrationTests
