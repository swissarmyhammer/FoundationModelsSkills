# The marketplace source list of the user layer of the fixture library. It
# shows the format of the file that `MarketplaceConfig` reads.
#
# The entry is a `github:owner/repo` form. `autoUpdate` is off, thus a store
# made from this file fetches this marketplace only when a host asks.
marketplaces:
  - url: github:swissarmyhammer/skills
    alias: demo-skills
    autoUpdate: false
